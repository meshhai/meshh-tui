[package]
name = "meshh-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal client for MESHH route deliveries"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshhai/meshh-tui"
readme = "README.md"
keywords = ["meshh", "tui", "terminal", "routes", "delivery"]
categories = ["command-line-utilities"]

[[bin]]
name = "meshh"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
