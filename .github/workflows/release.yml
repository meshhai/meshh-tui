name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Use Stable Rust
        run: rustup default stable

      - name: Add Target
        run: rustup target add ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke Test Binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/meshh"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="${bin}.exe"
          fi

          "$bin" --help
          "$bin" login --help
          "$bin" tui --help

      - name: Package Unix Archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          staging="meshh_${tag}_${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/meshh" "$staging/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"

      - name: Package Windows Archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          $staging = "meshh_${tag}_${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/meshh.exe" "$staging/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "$staging/"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          $hash = (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $staging.zip" | Out-File -Encoding ascii "$staging.zip.sha256"

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshh-${{ matrix.target }}
          path: |
            meshh_*_${{ matrix.target }}.tar.gz
            meshh_*_${{ matrix.target }}.tar.gz.sha256
            meshh_*_${{ matrix.target }}.zip
            meshh_*_${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file=".github/release-notes/${tag}.md"
          notes_args=()

          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          else
            tag_type="$(git cat-file -t "$tag" 2>/dev/null || true)"
            if [ "$tag_type" != "tag" ]; then
              echo "::error::Release tags must be annotated or have checked-in notes at $notes_file"
              exit 1
            fi
            notes_args=(--notes-from-tag)
          fi

          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            "${notes_args[@]}" \
            --verify-tag
